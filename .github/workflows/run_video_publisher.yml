name: "24/7 Zazzle Video Pin Cloud Runner"
run-name: ${{ inputs.dry_run && 'Preview (no publication)' || inputs.publication_slot && format('Recovery {0}', inputs.publication_slot) || github.workflow }}

on:
  schedule:
    # Runs every 4 hours at minute 10 (unlimited free minutes on public repo)
    - cron: '10 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (simulate rendering without publishing to Pinterest)"
        required: false
        type: boolean
        default: true
      publication_slot:
        description: "Optional UTC slot YYYY-MM-DDTHH:10:00Z; max age 8 hours"
        required: false
        type: string
        default: ''
      upload_preview:
        description: "Upload MP4/JPG previews publicly for one day"
        required: false
        type: boolean
        default: false

concurrency:
  group: zazzle-video-publisher
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  execute-video-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Runner helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout Private Engine
        uses: actions/checkout@v4
        with:
          repository: hamouda1/Zazzle-Video-PinEngine
          token: ${{ secrets.GH_PAT }}
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: linux-py312-deps-${{ hashFiles('engine/requirements.txt', 'engine/creative/*lock.txt') }}

      - name: Install System Libraries & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
          playwright install chromium --with-deps

      - name: Install isolated Creative Engine 4.2.0
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          cd engine
          bash creative_setup_linux.sh

      - name: Resolve publication slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SLOT: ${{ inputs.publication_slot }}
        run: python prepare_slot.py

      - name: Execute Multi-Account Staggered Video Pin Publisher
        env:
          PUBLICATION_SLOT: ${{ steps.slot.outputs.slot }}
          PYTHONUNBUFFERED: "1"
          CREATIVE_ENGINE_PYTHON: ${{ github.workspace }}/engine/.venv-creative/bin/python
          PINTEREST_ACCOUNTS_JSON: ${{ secrets.PINTEREST_ACCOUNTS_JSON }}
          ZAZZLE_ASSOCIATE_ID: ${{ secrets.ZAZZLE_ASSOCIATE_ID || '238209628121657582' }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd engine
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python publish_video_pin.py --dry-run
          else
            python publish_video_pin.py
          fi

      - name: Upload explicitly requested public video previews
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.upload_preview
        uses: actions/upload-artifact@v4
        with:
          name: video-pin-preview
          path: |
            engine/temp_media/**/*.mp4
            engine/temp_media/**/*_cover.jpg
          retention-days: 1
          if-no-files-found: ignore
