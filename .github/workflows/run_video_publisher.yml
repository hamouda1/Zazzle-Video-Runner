name: "24/7 Zazzle Video Pin Cloud Runner"

on:
  schedule:
    # Runs every 4 hours at minute 10 (unlimited free minutes on public repo)
    - cron: '10 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (simulate rendering without publishing to Pinterest)"
        required: false
        type: boolean
        default: true

concurrency:
  group: zazzle-video-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute-video-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout Private Engine
        uses: actions/checkout@v4
        with:
          repository: hamouda1/Zazzle-Video-PinEngine
          token: ${{ secrets.GH_PAT }}
          ref: 176d3dde3fea6724e907e9962b177d589ff17fd1
          path: engine
          fetch-depth: 1

      - name: Configure Git Identity in Engine
        run: |
          cd engine
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install System Libraries & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
          playwright install chromium --with-deps

      - name: Install isolated Creative Engine 4.2.0
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          cd engine
          bash creative_setup_linux.sh

      - name: Execute Multi-Account Staggered Video Pin Publisher
        env:
          CREATIVE_ENGINE_PYTHON: ${{ github.workspace }}/engine/.venv-creative/bin/python
          PINTEREST_ACCOUNTS_JSON: ${{ secrets.PINTEREST_ACCOUNTS_JSON }}
          ZAZZLE_ASSOCIATE_ID: ${{ secrets.ZAZZLE_ASSOCIATE_ID || '238209628121657582' }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd engine
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python publish_video_pin.py --dry-run
          else
            python publish_video_pin.py
          fi

      - name: Upload Video Preview Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-pin-preview
          path: |
            engine/temp_media/*.mp4
            engine/temp_media/*_cover.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Final Queue State Sync
        if: success() && inputs.dry_run != true
        run: |
          cd engine
          git add video_queues.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Final queue state sync [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi
