name: Validate creative Runner without publishing
on:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    outputs:
      engine_sha: ${{ steps.contract.outputs.engine_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m unittest discover -s tests -v
      - id: contract
        run: python scripts/validate_workflow.py --output "$GITHUB_OUTPUT"
  private-engine-preview:
    needs: contract
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Runner probe code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hamouda1/Zazzle-Video-PinEngine
          ref: ${{ needs.contract.outputs.engine_sha }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          path: engine
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fonts and isolated renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          bash engine/creative_setup_linux.sh
      - name: Install separate collector environment
        run: |
          python -m venv .venv-collector
          .venv-collector/bin/python -m pip install -r engine/requirements.txt
          cd engine
          ../.venv-collector/bin/python -m unittest discover -s tests -v
      - name: Exercise Runner to private engine without live queues or Pinterest
        run: |
          .venv-collector/bin/python engine/tests/creative_pipeline_preview.py --creative-python "$GITHUB_WORKSPACE/engine/.venv-creative/bin/python" --output "$RUNNER_TEMP/private-creative-preview" --templates F06
      - name: Install browser for live Zazzle availability probe
        run: .venv-collector/bin/python -m playwright install chromium --with-deps
      - name: Probe real Zazzle collection with publishing blocked
        run: .venv-collector/bin/python scripts/probe_zazzle_collection.py --engine engine --output "$RUNNER_TEMP/live-zazzle-probe"
      # Deliberately no upload-artifact step: this Runner repository is public.
